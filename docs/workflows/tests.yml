name: Tests

on:
  push:
    branches-ignore: [bot-data]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned: 'ubuntu-latest' becomes Ubuntu 26 on 2026-10-19
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit & integration tests (offline)
        run: python -m pytest -q
      - name: Dry run smoke test (no secrets needed)
        run: python main.py run --dry-run --offline --max-posts 1 || echo "::notice::smoke test finished with a non-zero code (network/feeds)"
