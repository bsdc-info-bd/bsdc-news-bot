name: bsdc news 7.0 Enterprise Pipeline

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    # Self-verify this working branch on every push: the tests, the offline engine
    # self-test and a real publishing run, with no AI credentials anywhere.
    branches:
      - arena/01a0cce8-bsdc-news-bot

jobs:
  run-enterprise-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Test suite (engine, SEO, indexing — offline, no keys)
        run: |
          python -m pytest tests/ -q

      - name: Doctor self-test (local writing engine, no API key required)
        env:
          BSDC_LOG_LEVEL: INFO
        run: |
          python main.py doctor || echo "::warning::doctor reported a problem (non-fatal for this run)"

      - name: Execute bsdc news 7.0 Engine
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.INDEXING_SERVICE_ACCOUNT_JSON }}
          # No GEMINI_API_KEY / GROQ_API_KEY: articles are written locally by the
          # BSDC Cortex engine (bsdc_news/cortex), so a rejected model key can no
          # longer turn a publishing run red. Legacy secrets are ignored.
        run: |
          python main.py

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsdc-run-report
          path: reports/
          if-no-files-found: ignore
