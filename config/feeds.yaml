# bsdc news — news sources
# ------------------------------------------------------------------
# Add, remove or disable feeds here. No code changes needed.
#   url       RSS/Atom feed URL (required)
#   name      display name used for attribution
#   category  default category (auto-classification can override it)
#   weight    ranking weight: 1.0 = normal, 1.2 = preferred, 0.8 = less
#   max_items how many newest entries to consider per run
#   enabled   false = keep in the list but don't use
# ------------------------------------------------------------------

